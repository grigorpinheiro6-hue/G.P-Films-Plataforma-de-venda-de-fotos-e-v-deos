<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — G.P Films</title><style>body{background:#080808;color:#fff;font-family:Arial}.box{max-width:600px;margin:50px auto;padding:25px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:24px}input{width:100%;padding:13px;margin:8px 0;background:#191919;color:white;border:1px solid #444;border-radius:7px}button{padding:14px;width:100%;background:#d5aa54;border:0;border-radius:8px;font-weight:900;cursor:pointer}.pix{font-size:13px;background:#171717;padding:15px;border-radius:8px;word-break:break-all}</style></head><body><div class="box"><h1>Finalizar pedido</h1><div class="card"><h2>Pagamento via Pix</h2><p>Itens no carrinho: <b id="qty"></b></p><p>Total: <b id="total"></b></p><input placeholder="Seu nome"><input placeholder="Seu e-mail"><p>Chave Pix / QR Code aparecerá aqui quando o provedor de pagamento estiver conectado.</p><div class="pix">PIX-DEMONSTRAÇÃO — substitua pela cobrança criada pelo gateway.</div><br><button onclick="pay()">Já fiz o pagamento</button></div></div><script>let q=Number(localStorage.getItem('cart')||0);qty.textContent=q;total.textContent='R$ '+(q*10).toFixed(2).replace('.',',');function pay(){location.href='sucesso.html'}</script></body></html>
